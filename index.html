<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Better Tesla Theater</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🚗%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div class="container">
        <header>
            <h1>A Better Tesla Theater</h1>
            <p class="subtitle">Votre dashboard de divertissement et navigation</p>
        </header>

        <main>
            <!-- Section Vidéo -->
            <section class="category">
                <h2>📺 Vidéo</h2>
                <div class="grid">
                    <a href="https://www.youtube.com" target="_blank" class="card youtube">
                        <img src="https://www.youtube.com/s/desktop/5c3db75e/img/favicon_144x144.png" alt="YouTube" class="logo">
                        <div class="name">YouTube</div>
                    </a>
                    <a href="https://app.plex.tv" target="_blank" class="card plex">
                        <img src="https://www.plex.tv/wp-content/themes/plex/assets/img/favicons/plex-180.png" alt="Plex" class="logo">
                        <div class="name">Plex</div>
                    </a>
                    <a href="http://freebox-cugand.freeboxos.fr:8096/" target="_blank" class="card jellyfin">
                        <img src="https://jellyfin.org/images/logo.svg" alt="Jellyfin" class="logo">
                        <div class="name">Jellyfin</div>
                    </a>
                    <a href="https://www.primevideo.com" target="_blank" class="card prime">
                        <img src="https://m.media-amazon.com/images/G/01/digital/video/web/Logo-min.png" alt="Prime Video" class="logo">
                        <div class="name">Prime Video</div>
                    </a>
                    <a href="https://www.tf1.fr/tf1" target="_blank" class="card tf1">
                        <img src="https://www.tf1.fr/assets/favicon/icon-192.png" alt="TF1" class="logo">
                        <div class="name">myTF1</div>
                    </a>
                    <a href="https://www.france.tv" target="_blank" class="card francetv">
                        <img src="https://www.france.tv/assets/meta/favicon/icon-192x192.png" alt="France TV" class="logo">
                        <div class="name">France TV</div>
                    </a>
                    <a href="https://www.6play.fr" target="_blank" class="card sixplay">
                        <img src="https://www.6play.fr/android-chrome-512x512.png" alt="6play" class="logo">
                        <div class="name">6play</div>
                    </a>
                    <a href="https://www.molotov.tv" target="_blank" class="card molotov">
                        <img src="https://www.molotov.tv/static/images/favicons/icon-192x192.png" alt="Molotov" class="logo">
                        <div class="name">Molotov TV</div>
                    </a>
                </div>
            </section>

            <!-- Section Outils -->
            <section class="category">
                <h2>🛠️ Navigation & Outils</h2>
                <div class="grid">
                    <a href="https://abetterrouteplanner.com" target="_blank" class="card abrp">
                        <img src="https://abetterrouteplanner.com/favicon-192.png" alt="ABRP" class="logo">
                        <div class="name">ABRP</div>
                    </a>
                    <a href="https://www.google.com/maps" target="_blank" class="card gmaps">
                        <img src="https://www.google.com/images/branding/product/2x/maps_96in128dp.png" alt="Google Maps" class="logo">
                        <div class="name">Google Maps</div>
                    </a>
                    <a href="https://www.waze.com/live-map" target="_blank" class="card waze">
                        <img src="https://www.waze.com/assets/images/home/app_icon.png" alt="Waze" class="logo">
                        <div class="name">Waze</div>
                    </a>
                    <a href="https://chargemap.com/map" target="_blank" class="card chargemap">
                        <img src="https://chargemap.com/images/favicons/mstile-144x144.png" alt="Chargemap" class="logo">
                        <div class="name">Chargemap</div>
                    </a>
                    <a href="https://electroverse.com/fr-FR/map" target="_blank" class="card octopus">
                        <img src="https://electroverse.octopus.energy/assets/icons/icon-192.png" alt="Electroverse" class="logo">
                        <div class="name">Octopus Electroverse</div>
                    </a>
                </div>
            </section>

            <!-- Section Jeux -->
            <section class="category">
                <h2>🎮 Jeux</h2>
                <div class="grid">
                    <a href="https://2048game.com" target="_blank" class="card game">
                        <img src="https://play2048.co/meta/apple-touch-icon.png" alt="2048" class="logo">
                        <div class="name">2048</div>
                    </a>
                    <a href="https://krunker.io" target="_blank" class="card game">
                        <img src="https://krunker.io/img/favicon.png" alt="Krunker" class="logo">
                        <div class="name">Krunker.io</div>
                    </a>
                    <a href="https://skribbl.io" target="_blank" class="card game">
                        <img src="https://skribbl.io/img/favicon.png" alt="Skribbl" class="logo">
                        <div class="name">Skribbl.io</div>
                    </a>
                </div>
            </section>
        </main>

        <footer>
            <p>Made with ❤️ for Tesla | <a href="https://github.com/jeremygovi/abt-tesla" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
