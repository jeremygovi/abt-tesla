<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Better Tesla Theater</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🚗%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div class="container">
        <main>
            <!-- Section Vidéo -->
            <section class="category">
                <h2>Vidéo</h2>
                <div class="grid">
                    <a href="https://www.youtube.com" target="_blank" class="card youtube">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube" class="logo">
                        <div class="name">YouTube</div>
                    </a>
                    <a href="https://app.plex.tv" target="_blank" class="card plex">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Plex_logo_2022.svg" alt="Plex" class="logo logo-plex">
                        <div class="name">Plex</div>
                    </a>
                    <a href="http://freebox-cugand.freeboxos.fr:8096/" target="_blank" class="card jellyfin">
                        <img src="https://raw.githubusercontent.com/jellyfin/jellyfin-ux/master/branding/SVG/icon-transparent.svg" alt="Jellyfin" class="logo">
                        <div class="name">Jellyfin</div>
                    </a>
                    <a href="https://www.primevideo.com" target="_blank" class="card prime">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/f/f1/Prime_Video.png" alt="Prime Video" class="logo logo-prime">
                        <div class="name">Prime Video</div>
                    </a>
                    <a href="https://www.tf1.fr/tf1" target="_blank" class="card tf1">
                        <img src="https://www.e-marketing.fr/wp-content/uploads/2025/07/TF1-PUB-presente-ses-nouveaux-formats-F-684x513.jpg" alt="TF1" class="logo">
                        <div class="name">myTF1</div>
                    </a>
                    <a href="https://www.france.tv" target="_blank" class="card francetv">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/FranceTV-2011.svg" alt="France TV" class="logo">
                        <div class="name">France TV</div>
                    </a>
                    <a href="https://www.6play.fr" target="_blank" class="card sixplay">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/6play_Bleu.svg/1280px-6play_Bleu.svg.png" alt="6play" class="logo">
                        <div class="name">6play</div>
                    </a>
                    <a href="https://www.molotov.tv" target="_blank" class="card molotov">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/d/d4/Molotov_By_fubo.jpg" alt="Molotov" class="logo">
                        <div class="name">Molotov TV</div>
                    </a>
                </div>
            </section>

            <!-- Section Outils -->
            <section class="category">
                <h2>🛠️ Navigation & Outils</h2>
                <div class="grid">
                    <a href="https://abetterrouteplanner.com" target="_blank" class="card abrp">
                        <img src="https://cdn.aptoide.com/imgs/e/b/3/eb31b0a171dc16c362864878d0bfdca7_fgraphic.png" alt="ABRP" class="logo">
                        <div class="name">ABRP</div>
                    </a>
                    <a href="https://www.google.com/maps" target="_blank" class="card gmaps">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/a/aa/Google_Maps_icon_%282020%29.svg" alt="Google Maps" class="logo">
                        <div class="name">Google Maps</div>
                    </a>
                    <a href="https://www.waze.com/live-map" target="_blank" class="card waze">
                        <img src="https://9to5google.com/wp-content/uploads/sites/4/2020/06/waze_logo_2020.png" alt="Waze" class="logo">
                        <div class="name">Waze</div>
                    </a>
                    <a href="https://chargemap.com/map" target="_blank" class="card chargemap">
                        <img src="https://www.vehiculedufutur.com/tmp/thumbs/images/img-3dac034517375ce1c3971ba7f9d73e15.png" alt="Chargemap" class="logo">
                        <div class="name">Chargemap</div>
                    </a>
                    <a href="https://electroverse.com/fr-FR/map" target="_blank" class="card octopus">
                        <img src="https://wepoweryourcar.com/wp-content/uploads/Octopus-Electroverse-Review-and-Guide.png" alt="Electroverse" class="logo">
                        <div class="name">Octopus Electroverse</div>
                    </a>
                </div>
            </section>

            <!-- Section Jeux -->
            <section class="category">
                <h2>🎮 Jeux</h2>
                <div class="grid">
                    <a href="https://2048game.com" target="_blank" class="card game">
                        <img src="https://raw.githubusercontent.com/gabrielecirulli/2048/master/meta/apple-touch-icon.png" alt="2048" class="logo">
                        <div class="name">2048</div>
                    </a>
                </div>
            </section>
        </main>

        <footer>
            <p>Made with ❤️ for Tesla | <a href="https://github.com/jeremygovi/abt-tesla" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
